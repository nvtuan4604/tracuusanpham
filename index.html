<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu sản phẩm</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f3f4f6; color: #111; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .search { flex: 1; min-width: 280px; }
  .search label { font-weight: 600; display: block; margin-bottom: 6px; }
  .search input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #4472c4; border-radius: 6px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button, .btn { background: #4472c4; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
  button.secondary, .btn.secondary { background: #6b7280; }
  .info { margin: 12px 0 6px; color: #444; font-size: 14px; }
  .tablebox { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; overflow: auto; max-height: 60vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #4472c4; color: #fff; white-space: nowrap; }
  td { max-width: 420px; min-width: 60px; word-break: break-word; }
  th.c, td.c { width: 38px; min-width: 38px; max-width: 38px; padding: 4px; text-align: center; }
  tr:hover td { background: #eef3fb; }
  mark { background: #fde68a; }
  .copybtn { background: transparent; color: #4472c4; border: 0; padding: 5px; border-radius: 4px; cursor: pointer; line-height: 0; }
  .copybtn:hover { background: #dbe4f5; }
  .copybtn.done { color: #047857; }
  .copybtn svg { width: 16px; height: 16px; }
  .empty { padding: 30px; text-align: center; color: #666; }
  .add { margin-top: 16px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 14px; }
  .add h3 { margin: 0 0 4px; }
  .add .hint { margin: 0 0 10px; font-size: 12px; color: #6b7280; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .grid label { font-size: 12px; color: #444; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid input { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; }
  .msg { margin-left: 10px; font-size: 14px; }
  .ok { color: #047857; } .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="search">
      <label for="q">Nhập sản phẩm cần mua</label>
      <input id="q" placeholder="Gõ đầy đủ hoặc một phần tên (có thể gõ không dấu, nhiều từ cách nhau bằng dấu cách)" autofocus>
    </div>
    <div class="actions">
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <button id="btnImport">Import excel</button>
      <a class="btn secondary" href="/api/export">Tải file Excel</a>
    </div>
  </div>
  <div class="info"><span id="count"></span><span id="importMsg" class="msg"></span></div>

  <div class="tablebox">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Chưa có dữ liệu. Bấm “Import excel” để chọn file.</div>
  </div>
  <p><button id="more" class="secondary" style="display:none">Xem thêm</button></p>

  <div class="add" id="addBox" style="display:none">
    <h3>Thêm sản phẩm mới</h3>
    <p class="hint">Các ô có dữ liệu giống nhau ở nhiều dòng đã được điền sẵn (vẫn sửa được). Ô để trống là ô cần bạn nhập.</p>
    <div class="grid" id="form"></div>
    <p><button id="btnAdd">Thêm sản phẩm</button><span id="addMsg" class="msg"></span></p>
  </div>
</div>

<script>
// true  = mỗi lần tải lại trang sẽ XÓA dữ liệu cũ (phải import lại từ đầu)
// false = tải lại trang vẫn giữ dữ liệu (nên dùng khi nhiều người cùng sử dụng / khi đưa lên mạng)
const RESET_ON_LOAD = true;

// Tự điền ô nhập: chỉ điền khi giá trị phổ biến nhất xuất hiện ở ít nhất 2 dòng
// VÀ chiếm từ 30% số dòng trở lên. Đổi 0.3 thành số nhỏ hơn (vd 0.1) nếu muốn điền dễ hơn.
const AUTOFILL_MIN_SHARE = 0.3;

const PAGE = 200;
let columns = [], offset = 0, term = '', timer;
let shownRows = []; // các dòng đang hiển thị, dùng cho nút sao chép

const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function highlight(text, terms) {
  let out = esc(text);
  terms.forEach((t) => {
    if (!t) return;
    const re = new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

function renderColumns(cols) {
  columns = cols;
  $('thead').innerHTML = '<tr><th class="c"></th>' + cols.map((c) => `<th>${esc(c)}</th>`).join('') + '</tr>';
  $('form').innerHTML = cols.map((c, i) =>
    `<div><label title="${esc(c)}">${esc(c)}</label><input data-i="${i}"></div>`).join('');
  $('addBox').style.display = cols.length ? 'block' : 'none';
}

async function load(reset) {
  if (reset) { offset = 0; shownRows = []; $('tbody').innerHTML = ''; }
  const url = `/api/products?q=${encodeURIComponent(term)}&limit=${PAGE}&offset=${offset}`;
  const { columns: cols, total, rows } = await (await fetch(url)).json();
  if (JSON.stringify(cols) !== JSON.stringify(columns)) renderColumns(cols);
  const terms = term.split(/\s+/).filter(Boolean);
  const start = shownRows.length;
  shownRows.push(...rows);
  $('tbody').insertAdjacentHTML('beforeend', rows.map((r, k) =>
    `<tr><td class="c"><button class="copybtn" data-idx="${start + k}" title="Sao chép cả dòng">${COPY_SVG}</button></td>` +
    columns.map((c) => `<td>${highlight(r[c], terms)}</td>`).join('') + '</tr>').join(''));
  offset += rows.length;
  $('empty').style.display = columns.length ? 'none' : 'block';
  $('count').textContent = !columns.length ? ''
    : term ? `Tìm thấy ${total} dòng` : `Toàn bộ danh sách: ${total} dòng`;
  $('more').style.display = offset < total ? 'inline-block' : 'none';
}

// ---- Sao chép cả dòng (các ô cách nhau bằng Tab, dán vào Excel sẽ chia đúng ô) ----
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}
$('tbody').addEventListener('click', async (e) => {
  const b = e.target.closest('.copybtn');
  if (!b) return;
  const r = shownRows[+b.dataset.idx];
  if (!r) return;
  const text = columns.map((c) => String(r[c] ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t');
  await copyText(text);
  b.innerHTML = CHECK_SVG; b.classList.add('done');
  setTimeout(() => { b.innerHTML = COPY_SVG; b.classList.remove('done'); }, 1200);
});

// ---- Tự điền ô "Thêm sản phẩm mới" theo giá trị phổ biến nhất của từng cột ----
async function fetchAllRows() {
  const all = [];
  let off = 0;
  for (let p = 0; p < 50; p++) {
    const { total, rows } = await (await fetch(`/api/products?q=&limit=1000&offset=${off}`)).json();
    all.push(...rows);
    off += rows.length;
    if (!rows.length || off >= total) break;
  }
  return all;
}

// force = true: ghi đè cả những ô người dùng đã tự gõ (dùng sau import / sau khi thêm xong)
async function fillDefaults(force) {
  if (!columns.length) return;
  const rows = await fetchAllRows();
  columns.forEach((c, i) => {
    const input = document.querySelector(`#form input[data-i="${i}"]`);
    if (!input) return;
    if (input.dataset.dirty && !force) return; // người dùng đang tự nhập, giữ nguyên
    const count = new Map();
    for (const r of rows) {
      const v = r[c] ?? '';
      if (v !== '') count.set(v, (count.get(v) || 0) + 1);
    }
    let best = '', n = 0;
    for (const [v, k] of count) if (k > n) { best = v; n = k; }
    const ok = rows.length > 0 && n >= 2 && n / rows.length >= AUTOFILL_MIN_SHARE;
    input.value = ok ? best : '';
    delete input.dataset.dirty;
  });
}
// Ghi nhớ ô nào người dùng đã tự sửa
$('form').addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.i !== undefined) e.target.dataset.dirty = '1';
});

$('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => { term = e.target.value.trim(); load(true); }, 250);
});
$('more').onclick = () => load(false);

$('btnImport').onclick = () => $('file').click();
$('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  $('importMsg').className = 'msg'; $('importMsg').textContent = 'Đang import...';
  const r = await fetch('/api/import', { method: 'POST', body: fd });
  const j = await r.json();
  $('importMsg').className = 'msg ' + (r.ok ? 'ok' : 'err');
  $('importMsg').textContent = r.ok ? `Đã import ${j.imported} dòng, ${j.columns} cột.` : j.error;
  e.target.value = '';
  $('q').value = ''; term = '';
  await load(true);
  await fillDefaults(true);
};

$('btnAdd').onclick = async () => {
  const body = {};
  document.querySelectorAll('#form input').forEach((inp) => (body[columns[inp.dataset.i]] = inp.value.trim()));
  const r = await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  $('addMsg').className = 'msg ' + (r.ok ? 'ok' : 'err');
  $('addMsg').textContent = r.ok ? 'Đã thêm sản phẩm.' : j.error;
  if (r.ok) {
    await load(true);
    await fillDefaults(true); // xóa phần vừa nhập, điền lại giá trị mặc định
  }
};

(async () => {
  if (RESET_ON_LOAD) await fetch('/api/reset', { method: 'POST' });
  await load(true);
  await fillDefaults(true);
})();
</script>
</body>
</html>
